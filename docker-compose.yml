version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
    ports:
      - "18000:8000"

  vulnbox_blue1:
    build: ./vulnboxes/echo
    hostname: vulnbox_blue1
    ports:
      - "20081:80"
    environment:
      PLATFORM_TOKEN: ${PLATFORM_TOKEN}

  # Uncomment to add a second blue team
  # vulnbox_blue2:
  #   build: ./vulnboxes/echo
  #   hostname: vulnbox_blue2
  #   ports:
  #     - "20082:80"
  #   environment:
  #     PLATFORM_TOKEN: ${PLATFORM_TOKEN}

volumes:
  dbdata: {}
